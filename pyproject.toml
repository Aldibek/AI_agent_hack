[project]
name = "reqaudit"
version = "0.1.0"
description = "Агент статической проверки требований по ISO/IEC/IEEE 29148 и IEEE 830"
requires-python = ">=3.10"
dependencies = [
  "pymupdf4llm>=0.2",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.6",
  "python-docx>=1.1",
]

[project.scripts]
reqaudit = "reqaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reqaudit"]
