name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests (no network, no API keys)
        run: python -m unittest discover -s tests -v
      - name: Smoke run without LLM
        run: python -m reqaudit docs/requirements.md reports/ci/report.md --no-llm
